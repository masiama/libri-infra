apiVersion: 1
groups:
    - orgId: 1
      name: libri
      folder: Libri
      interval: 1m
      rules:
        - uid: bg20943v2hqtcd
          title: Disk almost full
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: 100 * (1 - max by (host, mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|vfat|overlay|squashfs",mountpoint!~"/boot.*|/System/Volumes/(Update|VM|Preboot|xarts|iSCPreboot|Hardware).*|/Volumes/Recovery.*|/Users/.*/OrbStack.*"}) / max by (host, mountpoint) (node_filesystem_size_bytes{fstype!~"tmpfs|vfat|overlay|squashfs",mountpoint!~"/boot.*|/System/Volumes/(Update|VM|Preboot|xarts|iSCPreboot|Hardware).*|/Volumes/Recovery.*|/Users/.*/OrbStack.*"}))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 80
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: libri
          panelId: 5
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            __dashboardUid__: libri
            __panelId__: "5"
            summary: Disk {{ $labels.host }} {{ $labels.mountpoint }} is {{ humanize $values.A.Value }}% full
          labels:
            severity: warning
          isPaused: false
          notification_settings:
            receiver: email
        - uid: dg209d5t906wwc
          title: Disk full soon
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: 100 * (1 - max by (host, mountpoint) (node_filesystem_avail_bytes{fstype!~"tmpfs|vfat|overlay|squashfs",mountpoint!~"/boot.*|/System/Volumes/(Update|VM|Preboot|xarts|iSCPreboot|Hardware).*|/Volumes/Recovery.*|/Users/.*/OrbStack.*"}) / max by (host, mountpoint) (node_filesystem_size_bytes{fstype!~"tmpfs|vfat|overlay|squashfs",mountpoint!~"/boot.*|/System/Volumes/(Update|VM|Preboot|xarts|iSCPreboot|Hardware).*|/Volumes/Recovery.*|/Users/.*/OrbStack.*"}))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 90
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: libri
          panelId: 5
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            __dashboardUid__: libri
            __panelId__: "5"
            summary: Disk {{ $labels.host }} {{ $labels.mountpoint }} is {{ humanize $values.A.Value }}% full
          labels:
            severity: critical
          isPaused: false
          notification_settings:
            receiver: email
        - uid: bg209jfg0thxcb
          title: Low memory
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: 100 * (max by (host) (node_memory_MemAvailable_bytes) or max by (host) (node_memory_free_bytes + node_memory_inactive_bytes + node_memory_purgeable_bytes)) / (max by (host) (node_memory_MemTotal_bytes) or max by (host) (node_memory_total_bytes))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: '{{ $labels.host }} has only {{ humanize $values.A.Value }}% memory available'
          labels:
            severity: critical
          isPaused: false
          notification_settings:
            receiver: email
        - uid: bg209plpr1xq8a
          title: Host not reporting
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: count by (host) (max_over_time(up[1d])) unless count by (host) (up)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '{{ $labels.host }} stopped sending metrics'
          labels:
            severity: critical
          isPaused: false
          notification_settings:
            receiver: email
        - uid: fg20y0wjn52psf
          title: Metrics scrape failing
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: min by (host, job) (up)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            summary: '{{ $labels.job }} on {{ $labels.host }} keeps failing to scrape'
          labels:
            severity: warning
          isPaused: false
          notification_settings:
            receiver: email
        - uid: cg3nzwn4so934f
          title: Battery low
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: min by (host) (libri_battery_percent and on (host) libri_on_ac_power == 0)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 20
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '{{ $labels.host }} runs on battery at {{ humanize $values.A.Value }}%'
          labels:
            severity: critical
          isPaused: false
          notification_settings:
            receiver: email
        - uid: cg3o056f8hpmof
          title: Battery dying
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: min by (host) (libri_battery_seconds_remaining and on (host) libri_on_ac_power == 0) / 60
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 30
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 2m
          annotations:
            summary: '{{ $labels.host }} has about {{ humanize $values.A.Value }} minutes of battery left'
          labels:
            severity: critical
          isPaused: false
          notification_settings:
            receiver: email
        - uid: bg3o3voeybmdcc
          title: API errors
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: 100 * sum by (host) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*|.*/events"}[10m])) / sum by (host) (rate(http_server_requests_seconds_count{uri!~"/actuator.*|.*/events"}[10m]))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 10m
          annotations:
            summary: '{{ $labels.host }}: {{ humanize $values.A.Value }}% of API requests fail with 5xx'
          labels:
            severity: warning
          isPaused: false
          notification_settings:
            receiver: email
        - uid: ag3o3yrz9296of
          title: Crawler queue stuck
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: max by (host) (libri_crawler_events_queue_length)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1000
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            summary: '{{ $labels.host }} has {{ humanize $values.A.Value }} crawler events waiting for the API'
          labels:
            severity: warning
          isPaused: false
          notification_settings:
            receiver: email
        - uid: fg3o41e3utfy8f
          title: Crawl failed
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: sum by (host) (increase(libri_crawl_failed_total[10m]))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            summary: A crawl failed on {{ $labels.host }}
          labels:
            severity: warning
          isPaused: false
          notification_settings:
            receiver: email
